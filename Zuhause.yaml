              {% for n, t, h in [('Schlafzimmer','sensor.schlafzimmer_schlafzimmer_temperatur','sensor.schlafzimmer_schlafzimmer_luftfeuchtigkeit'),('Frida','sensor.frida_temperatur','sensor.frida_luftfeuchtigkeit'),('Matilda','sensor.kids_matilda_kids_matilda_temperature','sensor.kids_matilda_kids_matilda_humidity'),('Bad','sensor.bad_temperature','sensor.bad_humidity'),('Arbeitszimmer','sensor.abstellkammer_temperature','sensor.abstellkammer_humidity')] %}
              {% if states(h)|float(0) > 60 %}{% set ns.w = ns.w + [n ~ ' ' ~ (states(h)|float|round(0)|int) ~ ' %'] %}{% endif %}
              {% endfor %}
              {% if ns.w %}Zu feucht: {{ ns.w|join(', ') }}{% else %}Alle Räume unter 60 % rF{% endif %}
            icon: mdi:water-alert-outline
            icon_color: "{% set ns = namespace(w=0) %}{% for h in ['sensor.schlafzimmer_schlafzimmer_luftfeuchtigkeit','sensor.frida_luftfeuchtigkeit','sensor.kids_matilda_kids_matilda_humidity','sensor.bad_humidity','sensor.abstellkammer_humidity'] %}{% if states(h)|float(0) > 60 %}{% set ns.w = ns.w + 1 %}{% endif %}{% endfor %}{{ 'orange' if ns.w else 'green' }}"
            layout: horizontal
            entity: sensor.schlafzimmer_schlafzimmer_luftfeuchtigkeit
            tap_action: *id001
            multiline_secondary: true
          - type: markdown
            content: |-
              **So rechnet der Assistent**
              Der Taupunkt wird näherungsweise als `T − (100 − rF)/5` berechnet. Der Keller wird nur dann zum Lüften empfohlen, wenn der Außentaupunkt unter dem Keller-Taupunkt *und* mindestens 2 K unter der Kellertemperatur liegt – sonst kondensiert die Außenluft an den kühlen Wänden und der Keller wird feuchter statt trockener.
