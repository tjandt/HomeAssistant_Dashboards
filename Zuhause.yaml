            title: Preisliste (günstigster E10 zuerst)
            content: |-
              {% set ns = namespace(l=[]) %}
              {% for n, s in [('ARAL Fritzlarer Str. 61','aral_fritzlarer_strasse_61'),('Esso Dr.-Reimer-Str. 2','esso_dr_reimer_str_2'),('Honsel Kasseler Str. 65','honsel_kasseler_str_65'),('Q1 Nürnberger Str. 28','q1_nurnberger_strasse_28'),('STAR Fritzlarer Str. 67','star_fritzlarer_strasse_67'),('Tankcenter Nürnberger Str. 16','tankcenter_nuernberger_str_16')] %}
              {% set p = states('sensor.' ~ s ~ '_super_e10')|float(0) %}
              {% set d = states('sensor.' ~ s ~ '_diesel')|float(0) %}
              {% set e5 = states('sensor.' ~ s ~ '_super')|float(0) %}
              {% set is_open = not is_state('binary_sensor.' ~ s ~ '_status', 'off') %}
              {% set ns.l = ns.l + [{'n': n, 'e10': p, 'e5': e5, 'd': d, 'o': is_open, 'k': (p if (p > 0 and is_open) else 99)}] %}
              {% endfor %}
              | Tankstelle | E10 | Super E5 | Diesel | |
              |---|--:|--:|--:|---|
              {%- for x in ns.l|sort(attribute='k') %}
              | {{ x.n }} | {{ '%.3f'|format(x.e10) if x.e10 > 0 else '–' }} | {{ '%.3f'|format(x.e5) if x.e5 > 0 else '–' }} | {{ '%.3f'|format(x.d) if x.d > 0 else '–' }} | {{ ('🥇' if loop.first and x.k < 99 else '') if x.o else '🔴 zu' }} |
              {%- endfor %}
          - type: custom:mini-graph-card
            name: Super E10 – 24 h
            hours_to_show: 24
            points_per_hour: 1
            line_width: 2
            smoothing: false
            entities:
              - entity: sensor.aral_fritzlarer_strasse_61_super_e10
                name: ARAL
              - entity: sensor.honsel_kasseler_str_65_super_e10
                name: Honsel
              - entity: sensor.star_fritzlarer_strasse_67_super_e10
                name: STAR
            show:
              legend: true
              labels: false
          - type: statistics-graph
            title: Super E10 – 90 Tage (Mittel/Min/Max)
            chart_type: line
            period: day
            days_to_show: 90
            stat_types:
              - mean
              - min
              - max
