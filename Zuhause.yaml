# =============================================================================
#  Zuhause – Home-Assistant-Dashboard (Melsungen + Rochlitz)
# =============================================================================
#  Einrichtung:  Einstellungen → Dashboards → Dashboard hinzufügen
#                Titel "Zuhause", URL "dashboard-zuhause" → öffnen → ⋮ → Roh-Konfigurationseditor
#                → gesamten Inhalt dieser Datei einfügen.
#  Anderer URL-Pfad?  sed -i 's#/dashboard-zuhause/#/MEIN-PFAD/#g' Zuhause.yaml
#
#  Benötigte Frontend-Karten (HACS): mushroom, mini-graph-card, apexcharts-card.
#  Nur für einzelne Karten: sonos-card, soundtouchplus-card, body-miscale-card,
#  landroid-card, flightradar-flight-card, pi-hole  (alle waren schon im Original).
#  Kein layout-card mehr nötig: alle Ansichten nutzen das native "sections"-Layout.
#
#  Sichtbarkeit: Alle Ansichten außer "Rochlitz" und "Backofen" sind – wie im
#  Original – auf die Benutzer-ID aus dem Original beschränkt (siehe `visible`).
# =============================================================================
title: Zuhause
views:
  - title: Übersicht
    path: uebersicht
    icon: mdi:view-dashboard-outline
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Heute
            heading_style: title
            icon: mdi:calendar-today
          - type: custom:mushroom-title-card
            title: "{% set h = now().hour %}{{ 'Guten Morgen' if h < 11 else ('Guten Tag' if h < 18 else 'Guten Abend') }}"
            subtitle: "{{ ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'][now().weekday()] }}, {{ now().day }}. {{ ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'][now().month - 1] }} {{ now().year }}"
          - type: tile
            entity: weather.forecast_home
            name: Wetter Melsungen
            vertical: false
            features_position: bottom
            features:
              - type: daily-forecast
          - type: calendar
            entities:
              - calendar.jandt
            initial_view: listWeek
      - type: grid
        cards:
          - type: heading
            heading: Auffälligkeiten
            heading_style: title
            icon: mdi:bell-alert-outline
          - type: markdown
            title: Was braucht Aufmerksamkeit?
            content: |-
              {% set ns = namespace(m=[], r=[], t=[], d=[], dead=[]) %}
              {% if is_state('binary_sensor.waschmaschine_error_state','on') %}{% set ns.m = ns.m + ['🫧 Waschmaschine meldet einen Fehler: ' ~ states('sensor.waschmaschine_error_message')] %}{% endif %}
              {% for n, e in [('Arbeitszimmer','sensor.office_co2_office_eco2'),('Küche','sensor.wetterstation_co2'),('Schlafzimmer','sensor.schlafzimmer_schlafzimmer_co2_equivalent'),('Frida','sensor.frida_frida_co2_equivalent_2')] %}{% if states(e)|float(0) > 1400 %}{% set ns.m = ns.m + ['💨 CO₂ ' ~ n ~ ': ' ~ (states(e)|float|round(0)|int) ~ ' ppm – bitte lüften'] %}{% endif %}{% endfor %}
              {% for n, e in [('Arbeitszimmer','sensor.abstellkammer_humidity'),('Schlafzimmer','sensor.schlafzimmer_schlafzimmer_luftfeuchtigkeit'),('Frida','sensor.frida_luftfeuchtigkeit'),('Matilda','sensor.kids_matilda_kids_matilda_humidity')] %}{% if states(e)|float(0) > 65 %}{% set ns.m = ns.m + ['💧 Luft zu feucht in ' ~ n ~ ': ' ~ (states(e)|float|round(0)|int) ~ ' % (Schimmelrisiko)'] %}{% endif %}{% endfor %}
              {% if is_state('switch.kuhlschrank_outlet','off') %}{% set ns.m = ns.m + ['🧊 Kühlschrank-Steckdose Melsungen ist AUS'] %}{% endif %}
              {% if states('sensor.kuhlschrank_power') == 'unavailable' %}{% set ns.m = ns.m + ['🧊 Kühlschrank-Messung Melsungen offline'] %}{% endif %}
              {% if states('sensor.audi_a5_avant_tank_level')|float(100) < 15 %}{% set ns.m = ns.m + ['⛽ Audi: Tank nur noch ' ~ (states('sensor.audi_a5_avant_tank_level')|float|round(0)|int) ~ ' %'] %}{% endif %}
              {% for n, e in [('Wohnzimmer','sensor.rochlitz_wohnzimmer_temperatur'),('Büro','sensor.esp32c3_rl_buro_temperature_2'),('Tilo','sensor.indoor_temperature'),('Serverraum','sensor.rochlitz_serverraum_serverraum_temperatur')] %}{% if is_number(states(e)) and states(e)|float < 5 %}{% set ns.r = ns.r + ['🥶 Frostgefahr ' ~ n ~ ': ' ~ (states(e)|float|round(1)) ~ ' °C'] %}{% endif %}{% endfor %}
              {% if is_number(states('sensor.rochlitz_oma_temperatur')) and states('sensor.rochlitz_oma_temperatur')|float < 16 %}{% set ns.r = ns.r + ['👵 Oma-Zimmer nur ' ~ (states('sensor.rochlitz_oma_temperatur')|float|round(1)) ~ ' °C'] %}{% endif %}
              {% if states('sensor.rochlitz_serverraum_serverraum_temperatur')|float(0) > 30 %}{% set ns.r = ns.r + ['🖥️ Serverraum Rochlitz warm: ' ~ (states('sensor.rochlitz_serverraum_serverraum_temperatur')|float|round(1)) ~ ' °C'] %}{% endif %}
              {% if is_number(states('sensor.uvr16x2_node_2_analog_logging_2')) and states('sensor.uvr16x2_node_2_analog_logging_2')|float < 35 %}{% set ns.r = ns.r + ['🚿 Warmwasser Rochlitz nur ' ~ (states('sensor.uvr16x2_node_2_analog_logging_2')|float|round(1)) ~ ' °C'] %}{% endif %}
              {% if states('sensor.aeg_backofen_upperoven_appliancestate')|lower == 'running' %}{% set ns.r = ns.r + ['🥘 Backofen Rochlitz ist in Betrieb (' ~ states('sensor.aeg_backofen_upperoven_displaytemperaturec') ~ ' °C)'] %}{% endif %}
              {% if is_state('binary_sensor.kaffeevollautomat_konnektivitat','off') %}{% set ns.r = ns.r + ['☕ Kaffeevollautomat Rochlitz offline'] %}{% endif %}
              {% if states('camera.eingang') == 'unavailable' %}{% set ns.r = ns.r + ['📷 Kamera „Eingang“ offline'] %}{% endif %}
              {% if states('camera.hintereingang') == 'unavailable' %}{% set ns.r = ns.r + ['📷 Kamera „Hintereingang“ offline'] %}{% endif %}
              {% if states('sensor.rochlitz_kuhlschrank_power') == 'unavailable' %}{% set ns.r = ns.r + ['🧊 Kühlschrank-Messung Rochlitz offline'] %}{% endif %}
              {% for n, e in [('JandtNAS','jandtnas'),('TimeMachine','timemachine'),('RochlitzNAS','rochlitznas')] %}{% if is_state('binary_sensor.' ~ e ~ ('_sicherheitsstatus' if e == 'rochlitznas' else '_security_status'), 'on') %}{% set ns.t = ns.t + ['🛡️ ' ~ n ~ ': Sicherheitsstatus auffällig'] %}{% endif %}{% endfor %}
              {% if is_state('binary_sensor.rochlitznas_drive_1_max_fehlerhafte_sektoren_uberschritten','on') %}{% set ns.t = ns.t + ['💾 RochlitzNAS: zu viele defekte Sektoren'] %}{% endif %}
              {% if is_state('binary_sensor.rochlitznas_drive_1_unterhalb_der_mindestrestlebensdauer','on') %}{% set ns.t = ns.t + ['💾 RochlitzNAS: Platte unter Mindest-Restlebensdauer'] %}{% endif %}
              {% for n, e in [('JandtNAS','sensor.jandtnas_volume_1_volume_used'),('TimeMachine','sensor.timemachine_volume_1_volume_used')] %}{% if states(e)|float(0) > 85 %}{% set ns.t = ns.t + ['📦 ' ~ n ~ ': Volume zu ' ~ (states(e)|float|round(0)|int) ~ ' % belegt'] %}{% endif %}{% endfor %}
              {% for n, e in [('RochlitzNAS','sensor.rochlitznas_drive_1_temperatur'),('JandtNAS','sensor.jandtnas_volume_1_average_disk_temp')] %}{% if states(e)|float(0) > 50 %}{% set ns.t = ns.t + ['🌡️ ' ~ n ~ ': Festplatten ' ~ (states(e)|float|round(0)|int) ~ ' °C'] %}{% endif %}{% endfor %}
              {% if states('sensor.ups_status_data') not in ['unknown','unavailable','none',''] and 'OL' not in states('sensor.ups_status_data') %}{% set ns.t = ns.t + ['🔋 USV nicht im Netzbetrieb (' ~ states('sensor.ups_status_data') ~ ')'] %}{% endif %}
              {% for n, e in [('Rochlitz','rochlitz'),('Melsungen','melsungen')] %}{% if is_state('binary_sensor.pi_hole_' ~ e ~ '_status','off') %}{% set ns.t = ns.t + ['🧱 Pi-hole ' ~ n ~ ' läuft nicht'] %}{% endif %}{% endfor %}
              {% for n, e in [('schwarz','sensor.samsung_c430w_toner_black'),('cyan','sensor.samsung_c430w_toner_cyan'),('magenta','sensor.samsung_c430w_toner_magenta'),('gelb','sensor.samsung_c430w_toner_yellow')] %}{% if is_number(states(e)) and states(e)|float <= 15 %}{% set ns.t = ns.t + ['🖨️ Toner ' ~ n ~ ' nur noch ' ~ (states(e)|float|round(0)|int) ~ ' %'] %}{% endif %}{% endfor %}
              {% if is_state('update.jandtnas_dsm_update','on') %}{% set ns.t = ns.t + ['⬆️ JandtNAS: DSM-Update verfügbar'] %}{% endif %}
              {% for n, e in [('Wohnzimmer MEL','sensor.wohnzimmer_temperature'),('Arbeitszimmer','sensor.abstellkammer_temperature'),('Küche','sensor.wetterstation_temperature'),('Bad','sensor.bad_temperature'),('Schlafzimmer','sensor.schlafzimmer_schlafzimmer_temperatur'),('Frida','sensor.frida_temperatur'),('Matilda','sensor.kids_matilda_kids_matilda_temperature'),('Keller','sensor.keller_bme280_temperature'),('Balkon','sensor.balkon_melsungen_temperature'),('Wohnzimmer RL','sensor.rochlitz_wohnzimmer_temperatur'),('Oma','sensor.rochlitz_oma_temperatur'),('Tilo','sensor.indoor_temperature'),('Büro RL','sensor.esp32c3_rl_buro_temperature_2'),('Serverraum','sensor.rochlitz_serverraum_serverraum_temperatur'),('Außen RL','sensor.temperature_humidity_sensor_7cd9_temperature'),('Warmwasser RL','sensor.uvr16x2_node_2_analog_logging_2'),('Kollektor','sensor.uvr16x2_node_2_input_7')] %}{% if states(e) in ['unavailable','unknown'] %}{% set ns.dead = ns.dead + [n] %}{% endif %}{% endfor %}
              {% if ns.dead %}{% set ns.d = ['Keine Messwerte: ' ~ ns.dead|join(', ')] %}{% endif %}
              {% set total = ns.m|length + ns.r|length + ns.t|length + ns.d|length %}
              {% if total == 0 %}✅ **Alles unauffällig** – keine Meldungen an beiden Standorten.{% else %}
              {% if ns.m %}**🏠 Melsungen**
              {% for x in ns.m %}- {{ x }}
              {% endfor %}
              {% endif %}
              {% if ns.r %}**🏡 Rochlitz**
              {% for x in ns.r %}- {{ x }}
              {% endfor %}
              {% endif %}
              {% if ns.t %}**🖥️ Technik**
              {% for x in ns.t %}- {{ x }}
              {% endfor %}
              {% endif %}
              {% if ns.d %}**📡 Datenqualität**
              {% for x in ns.d %}- {{ x }}
              {% endfor %}
              {% endif %}
              {% endif %}
      - type: grid
        cards:
          - type: heading
            heading: Melsungen
            heading_style: title
            icon: mdi:home-city-outline
            badges:
              - type: entity
                entity: sensor.balkon_melsungen_temperature
                show_state: true
                show_icon: true
                icon: mdi:thermometer
                color: orange
            tap_action:
              action: navigate
              navigation_path: /dashboard-zuhause/melsungen
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Innen Ø
                secondary: "{% set l = [states('sensor.wohnzimmer_temperature'),states('sensor.abstellkammer_temperature'),states('sensor.wetterstation_temperature'),states('sensor.bad_temperature'),states('sensor.schlafzimmer_schlafzimmer_temperatur'),states('sensor.frida_temperatur'),states('sensor.kids_matilda_kids_matilda_temperature')]|map('float', none)|reject('none')|list %}{{ ((l|sum/l|length)|round(1)|string ~ ' °C') if l else '–' }}"
                icon: mdi:home-thermometer-outline
                icon_color: "{% set l = [states('sensor.wohnzimmer_temperature'),states('sensor.abstellkammer_temperature'),states('sensor.wetterstation_temperature'),states('sensor.bad_temperature'),states('sensor.schlafzimmer_schlafzimmer_temperatur'),states('sensor.frida_temperatur'),states('sensor.kids_matilda_kids_matilda_temperature')]|map('float', none)|reject('none')|list %}{% set t = (l|sum/l|length) if l else none %}{% if t is none %}disabled{% elif t < 17 %}blue{% elif t < 20 %}cyan{% elif t < 24 %}green{% elif t < 27 %}orange{% else %}red{% endif %}"
                layout: vertical
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-zuhause/melsungen
              - type: custom:mushroom-template-card
                primary: Außen
                secondary: "{{ ((states('sensor.balkon_melsungen_temperature')|float|round(1)|string) ~ ' °C' if is_number(states('sensor.balkon_melsungen_temperature')) else '–') }} · {{ ((states('sensor.balkon_melsungen_humidity')|float|round(0)|int|string) ~ ' %' if is_number(states('sensor.balkon_melsungen_humidity')) else '–') }}"
                icon: mdi:tree-outline
                icon_color: "{% set t = states('sensor.balkon_melsungen_temperature')|float(none) %}{% if t is none %}disabled{% elif t < 0 %}indigo{% elif t < 10 %}blue{% elif t < 20 %}green{% elif t < 28 %}orange{% else %}red{% endif %}"
                layout: vertical
                entity: sensor.balkon_melsungen_temperature
                tap_action: &id001
                  action: more-info
              - type: custom:mushroom-template-card
                primary: Luftfeuchte Ø
                secondary: "{% set l = [states('sensor.abstellkammer_humidity'),states('sensor.wetterstation_humidity'),states('sensor.bad_humidity'),states('sensor.schlafzimmer_schlafzimmer_luftfeuchtigkeit'),states('sensor.frida_luftfeuchtigkeit'),states('sensor.kids_matilda_kids_matilda_humidity')]|map('float', none)|reject('none')|list %}{{ ((l|sum/l|length)|round(0)|int|string ~ ' %') if l else '–' }}"
                icon: mdi:water-percent
                icon_color: "{% set l = [states('sensor.abstellkammer_humidity'),states('sensor.wetterstation_humidity'),states('sensor.bad_humidity'),states('sensor.schlafzimmer_schlafzimmer_luftfeuchtigkeit'),states('sensor.frida_luftfeuchtigkeit'),states('sensor.kids_matilda_kids_matilda_humidity')]|map('float', none)|reject('none')|list %}{% set t = (l|sum/l|length) if l else none %}{% if t is none %}disabled{% elif t < 30 %}orange{% elif t < 40 %}amber{% elif t < 60 %}green{% elif t < 70 %}orange{% else %}red{% endif %}"
                layout: vertical
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-zuhause/melsungen
              - type: custom:mushroom-template-card
                primary: CO₂ max
                secondary: "{% set l = [states('sensor.office_co2_office_eco2'),states('sensor.wetterstation_co2'),states('sensor.schlafzimmer_schlafzimmer_co2_equivalent'),states('sensor.frida_frida_co2_equivalent_2')]|map('float', none)|reject('none')|list %}{{ ((l|max)|round(0)|int|string ~ ' ppm') if l else '–' }}"
                icon: mdi:molecule-co2
                icon_color: "{% set l = [states('sensor.office_co2_office_eco2'),states('sensor.wetterstation_co2'),states('sensor.schlafzimmer_schlafzimmer_co2_equivalent'),states('sensor.frida_frida_co2_equivalent_2')]|map('float', none)|reject('none')|list %}{% set t = l|max if l else none %}{% if t is none %}disabled{% elif t < 800 %}green{% elif t < 1200 %}amber{% elif t < 1600 %}orange{% else %}red{% endif %}"
                layout: vertical
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-zuhause/melsungen
              - type: custom:mushroom-template-card
                primary: Strom (Steckdosen)
                secondary: "{{ ([states('sensor.waschmaschine_power'),states('sensor.trockner_power'),states('sensor.kaffeemaschine_power'),states('sensor.kuhlschrank_power'),states('sensor.thermomix_power'),states('sensor.schlafzimmer_energy_power'),states('sensor.staubsauger_power'),states('sensor.wohnzimmer_power_consumption'),states('sensor.arbeitsplatz_power_2'),states('sensor.technik_power'),states('sensor.shelly_plug_s_shelly_plug_s_power'),states('sensor.smart_switch_24060472346212510802c4e7ae048cf8_power'),states('sensor.smart_switch_24060416836319510802c4e7ae048cef_power')]|map('float', 0)|sum)|round(0)|int }} W"
                icon: mdi:flash
                icon_color: "{% set p = [states('sensor.waschmaschine_power'),states('sensor.trockner_power'),states('sensor.kaffeemaschine_power'),states('sensor.kuhlschrank_power'),states('sensor.thermomix_power'),states('sensor.schlafzimmer_energy_power'),states('sensor.staubsauger_power'),states('sensor.wohnzimmer_power_consumption'),states('sensor.arbeitsplatz_power_2'),states('sensor.technik_power'),states('sensor.shelly_plug_s_shelly_plug_s_power'),states('sensor.smart_switch_24060472346212510802c4e7ae048cf8_power'),states('sensor.smart_switch_24060416836319510802c4e7ae048cef_power')]|map('float', 0)|sum %}{% if p < 300 %}green{% elif p < 800 %}amber{% else %}orange{% endif %}"
                layout: vertical
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-zuhause/energie
              - type: custom:mushroom-template-card
                primary: Waschen / Trocknen
                secondary: "{{ 'Wäsche läuft' if states('sensor.waschmaschine_power')|float(0) > 20 else 'Maschine bereit' }} · {{ 'Trockner läuft' if states('sensor.trockner_power')|float(0) > 20 else 'Trockner aus' }}"
                icon: mdi:washing-machine
                icon_color: "{{ 'blue' if states('sensor.waschmaschine_power')|float(0) > 20 or states('sensor.trockner_power')|float(0) > 20 else 'disabled' }}"
                layout: vertical
                entity: sensor.waschmaschine_power
                tap_action: *id001
                multiline_secondary: true
      - type: grid
        cards:
          - type: heading
            heading: Rochlitz
            heading_style: title
            icon: mdi:home-variant-outline
            badges:
              - type: entity
                entity: sensor.temperature_humidity_sensor_7cd9_temperature
                show_state: true
                show_icon: true
                icon: mdi:thermometer
                color: orange
            tap_action:
              action: navigate
              navigation_path: /dashboard-zuhause/rochlitz
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Außen
                secondary: "{{ ((states('sensor.temperature_humidity_sensor_7cd9_temperature')|float|round(1)|string) ~ ' °C' if is_number(states('sensor.temperature_humidity_sensor_7cd9_temperature')) else '–') }} · {{ ((states('sensor.temperature_humidity_sensor_7cd9_humidity')|float|round(0)|int|string) ~ ' %' if is_number(states('sensor.temperature_humidity_sensor_7cd9_humidity')) else '–') }}"
                icon: mdi:tree-outline
                icon_color: "{% set t = states('sensor.temperature_humidity_sensor_7cd9_temperature')|float(none) %}{% if t is none %}disabled{% elif t < 0 %}indigo{% elif t < 10 %}blue{% elif t < 20 %}green{% elif t < 28 %}orange{% else %}red{% endif %}"
                layout: vertical
                entity: sensor.temperature_humidity_sensor_7cd9_temperature
                tap_action: *id001
              - type: custom:mushroom-template-card
                primary: Wohnzimmer
                secondary: "{{ ((states('sensor.rochlitz_wohnzimmer_temperatur')|float|round(1)|string) ~ ' °C' if is_number(states('sensor.rochlitz_wohnzimmer_temperatur')) else '–') }} · {{ ((states('sensor.rochlitz_wohnzimmer_luftfeuchtigkeit')|float|round(0)|int|string) ~ ' %' if is_number(states('sensor.rochlitz_wohnzimmer_luftfeuchtigkeit')) else '–') }}"
                icon: mdi:sofa-outline
                icon_color: "{% set t = states('sensor.rochlitz_wohnzimmer_temperatur')|float(none) %}{% if t is none %}disabled{% elif t < 17 %}blue{% elif t < 20 %}cyan{% elif t < 24 %}green{% elif t < 27 %}orange{% else %}red{% endif %}"
                layout: vertical
                entity: sensor.rochlitz_wohnzimmer_temperatur
                tap_action: *id001
              - type: custom:mushroom-template-card
                primary: Oma
                secondary: "{{ ((states('sensor.rochlitz_oma_temperatur')|float|round(1)|string) ~ ' °C' if is_number(states('sensor.rochlitz_oma_temperatur')) else '–') }} · {{ ((states('sensor.rochlitz_oma_luftfeuchtigkeit')|float|round(0)|int|string) ~ ' %' if is_number(states('sensor.rochlitz_oma_luftfeuchtigkeit')) else '–') }}"
                icon: mdi:human-cane
                icon_color: "{% set t = states('sensor.rochlitz_oma_temperatur')|float(none) %}{% if t is none %}disabled{% elif t < 17 %}blue{% elif t < 20 %}cyan{% elif t < 24 %}green{% elif t < 27 %}orange{% else %}red{% endif %}"
                layout: vertical
                entity: sensor.rochlitz_oma_temperatur
                tap_action: *id001
              - type: custom:mushroom-template-card
                primary: Warmwasser
                secondary: "{{ ((states('sensor.uvr16x2_node_2_analog_logging_2')|float|round(1)|string) ~ ' °C' if is_number(states('sensor.uvr16x2_node_2_analog_logging_2')) else '–') }}"
                icon: mdi:water-boiler
                icon_color: "{% set t = states('sensor.uvr16x2_node_2_analog_logging_2')|float(none) %}{% if t is none %}disabled{% elif t < 35 %}blue{% elif t < 45 %}orange{% elif t < 60 %}red{% else %}purple{% endif %}"
                layout: vertical
                entity: sensor.uvr16x2_node_2_analog_logging_2
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-zuhause/rochlitz
              - type: custom:mushroom-template-card
                primary: Kollektor
                secondary: "{{ ((states('sensor.uvr16x2_node_2_input_7')|float|round(1)|string) ~ ' °C' if is_number(states('sensor.uvr16x2_node_2_input_7')) else '–') }}"
                icon: mdi:solar-power
                icon_color: "{% set t = states('sensor.uvr16x2_node_2_input_7')|float(none) %}{% if t is none %}disabled{% elif t < 30 %}blue{% elif t < 60 %}amber{% elif t < 90 %}orange{% else %}red{% endif %}"
                layout: vertical
                entity: sensor.uvr16x2_node_2_input_7
                tap_action: *id001
              - type: custom:mushroom-template-card
                primary: Strom (Steckdosen)
                secondary: "{{ ([states('sensor.rochlitz_kuhlschrank_power'),states('sensor.smart_switch_24060408263254510802c4e7ae048e5e_power'),states('sensor.smart_switch_24022135042720510d0148e1e9ed26af_power'),states('sensor.smart_switch_24022139185434510d0148e1e9ed14d7_power'),states('sensor.kaffeemaschine_rochlitz_power'),states('sensor.smart_switch_24022106833283510d0148e1e9ed3010_power'),states('sensor.smart_switch_23070778577851510d0248e1e9cfc20b_power'),states('sensor.smart_switch_23070739203051510d0248e1e9cfc328_power')]|map('float', 0)|sum)|round(0)|int }} W"
                icon: mdi:flash
                icon_color: "{% set p = [states('sensor.rochlitz_kuhlschrank_power'),states('sensor.smart_switch_24060408263254510802c4e7ae048e5e_power'),states('sensor.smart_switch_24022135042720510d0148e1e9ed26af_power'),states('sensor.smart_switch_24022139185434510d0148e1e9ed14d7_power'),states('sensor.kaffeemaschine_rochlitz_power'),states('sensor.smart_switch_24022106833283510d0148e1e9ed3010_power'),states('sensor.smart_switch_23070778577851510d0248e1e9cfc20b_power'),states('sensor.smart_switch_23070739203051510d0248e1e9cfc328_power')]|map('float', 0)|sum %}{% if p < 300 %}green{% elif p < 800 %}amber{% else %}orange{% endif %}"
                layout: vertical
                tap_action:
