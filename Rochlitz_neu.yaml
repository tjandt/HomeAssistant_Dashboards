# =============================================================================
#  Rochlitz – eigenständiges Home-Assistant-Dashboard (Neuentwurf von Rochlitz_view.yaml)
# =============================================================================
#  Einrichtung:  Einstellungen → Dashboards → Dashboard hinzufügen
#                Titel "Rochlitz", URL "dashboard-rochlitz" → öffnen → ⋮ → Roh-Konfigurationseditor
#                → gesamten Inhalt dieser Datei einfügen.
#  Anderer URL-Pfad?  sed -i 's#/dashboard-rochlitz/#/MEIN-PFAD/#g' Rochlitz_neu.yaml
#
#  Benötigte Frontend-Karten (HACS): mushroom, mini-graph-card, apexcharts-card.
#  Nur für einzelne Karten: landroid-card, flightradar-flight-card (wie im Original).
#  Nicht mehr nötig: layout-card (horizontal-layout), bar-card, Theme "Liquid Glass".
#  Alle Ansichten sind – wie im Original – für alle Dashboard-Nutzer sichtbar.
# =============================================================================
title: Rochlitz
views:
  - title: Übersicht
    path: uebersicht
    icon: mdi:view-dashboard-outline
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Rochlitz heute
            heading_style: title
            icon: mdi:home-variant-outline
          - type: custom:mushroom-title-card
            title: Rochlitz
            subtitle: "{{ ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'][now().weekday()] }}, {{ now().day }}. {{ ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'][now().month - 1] }} {{ now().year }}"
          - type: markdown
            title: Was braucht Aufmerksamkeit?
            content: |-
              {% set ns = namespace(h=[], t=[], d=[], dead=[]) %}
              {% for n, e in [('Wohnzimmer','sensor.rochlitz_wohnzimmer_temperatur'),('Oma','sensor.rochlitz_oma_temperatur'),('Tilo','sensor.indoor_temperature'),('Büro','sensor.esp32c3_rl_buro_temperature_2')] %}{% if is_number(states(e)) and states(e)|float < 5 %}{% set ns.h = ns.h + ['🥶 Frostgefahr ' ~ n ~ ': ' ~ (states(e)|float|round(1)) ~ ' °C'] %}{% endif %}{% endfor %}
              {% if is_number(states('sensor.rochlitz_oma_temperatur')) and states('sensor.rochlitz_oma_temperatur')|float < 18 %}{% set ns.h = ns.h + ['👵 Oma-Zimmer nur ' ~ (states('sensor.rochlitz_oma_temperatur')|float|round(1)) ~ ' °C (Soll ≥ 20 °C)'] %}{% endif %}
              {% for n, e in [('Wohnzimmer','sensor.rochlitz_wohnzimmer_luftfeuchtigkeit'),('Oma','sensor.rochlitz_oma_luftfeuchtigkeit'),('Tilo','sensor.indoor_humidity'),('Büro','sensor.esp32c3_rl_buro_humidity_2')] %}{% if states(e)|float(0) > 65 %}{% set ns.h = ns.h + ['💧 Luft zu feucht ' ~ n ~ ': ' ~ (states(e)|float|round(0)|int) ~ ' %'] %}{% endif %}{% endfor %}
              {% if is_number(states('sensor.uvr16x2_node_2_analog_logging_2')) and states('sensor.uvr16x2_node_2_analog_logging_2')|float < 35 %}{% set ns.h = ns.h + ['🚿 Warmwasser nur ' ~ (states('sensor.uvr16x2_node_2_analog_logging_2')|float|round(1)) ~ ' °C'] %}{% endif %}
              {% if states('sensor.aeg_backofen_upperoven_appliancestate')|lower == 'running' %}{% set ns.h = ns.h + ['🥘 Backofen ist in Betrieb (' ~ states('sensor.aeg_backofen_upperoven_displaytemperaturec') ~ ' °C)'] %}{% endif %}
              {% if is_state('binary_sensor.kaffeevollautomat_konnektivitat','off') %}{% set ns.h = ns.h + ['☕ Kaffeevollautomat offline'] %}{% endif %}
              {% if states('camera.eingang') == 'unavailable' %}{% set ns.h = ns.h + ['📷 Kamera „Eingang“ offline'] %}{% endif %}
              {% if states('camera.hintereingang') == 'unavailable' %}{% set ns.h = ns.h + ['📷 Kamera „Hintereingang“ offline'] %}{% endif %}
              {% if states('sensor.rochlitz_kuhlschrank_power') == 'unavailable' %}{% set ns.h = ns.h + ['🧊 Kühlschrank-Messung offline'] %}{% endif %}
              {% if is_state('binary_sensor.aeg_backofen_cleaningreminder','on') %}{% set ns.h = ns.h + ['🧽 Backofen: Reinigung fällig'] %}{% endif %}
              {% if is_state('binary_sensor.aeg_backofen_descalingreminderstate','on') %}{% set ns.h = ns.h + ['🧽 Backofen: Entkalken fällig'] %}{% endif %}
              {% if states('sensor.rochlitz_serverraum_serverraum_temperatur')|float(0) > 30 %}{% set ns.t = ns.t + ['🖥️ Serverraum warm: ' ~ (states('sensor.rochlitz_serverraum_serverraum_temperatur')|float|round(1)) ~ ' °C'] %}{% endif %}
              {% if is_state('binary_sensor.rochlitznas_sicherheitsstatus','on') %}{% set ns.t = ns.t + ['🛡️ RochlitzNAS: Sicherheitsstatus auffällig'] %}{% endif %}
              {% if is_state('binary_sensor.rochlitznas_drive_1_max_fehlerhafte_sektoren_uberschritten','on') %}{% set ns.t = ns.t + ['💾 RochlitzNAS: zu viele defekte Sektoren'] %}{% endif %}
              {% if is_state('binary_sensor.rochlitznas_drive_1_unterhalb_der_mindestrestlebensdauer','on') %}{% set ns.t = ns.t + ['💾 RochlitzNAS: Platte unter Mindest-Restlebensdauer'] %}{% endif %}
              {% if states('sensor.rochlitznas_drive_1_temperatur')|float(0) > 50 %}{% set ns.t = ns.t + ['🌡️ RochlitzNAS: Festplatte ' ~ (states('sensor.rochlitznas_drive_1_temperatur')|float|round(0)|int) ~ ' °C'] %}{% endif %}
              {% if states('sensor.rochlitznas_cpu_auslastung_gesamt')|float(0) > 90 %}{% set ns.t = ns.t + ['🧠 RochlitzNAS: CPU-Last über 90 %'] %}{% endif %}
              {% if states('sensor.rochlitznas_speichernutzung_real')|float(0) > 90 %}{% set ns.t = ns.t + ['🧠 RochlitzNAS: RAM über 90 %'] %}{% endif %}
              {% for n, e in [('Wohnzimmer','sensor.rochlitz_wohnzimmer_temperatur'),('Oma','sensor.rochlitz_oma_temperatur'),('Tilo','sensor.indoor_temperature'),('Büro','sensor.esp32c3_rl_buro_temperature_2'),('Serverraum','sensor.rochlitz_serverraum_serverraum_temperatur'),('Außen','sensor.temperature_humidity_sensor_7cd9_temperature'),('Warmwasser','sensor.uvr16x2_node_2_analog_logging_2'),('Kollektor','sensor.uvr16x2_node_2_input_7'),('Kessel','sensor.uvr16x2_node_2_input_1'),('Speicher oben','sensor.uvr16x2_node_2_input_2'),('Speicher unten','sensor.uvr16x2_node_2_input_4'),('Kühlschrank','sensor.rochlitz_kuhlschrank_power'),('Oma-Steckdose','sensor.smart_switch_24060408263254510802c4e7ae048e5e_power'),('NAS','sensor.rochlitznas_cpu_auslastung_gesamt')] %}{% if states(e) in ['unavailable','unknown'] %}{% set ns.dead = ns.dead + [n] %}{% endif %}{% endfor %}
              {% if ns.dead %}{% set ns.d = ['Keine Messwerte: ' ~ ns.dead|join(', ')] %}{% endif %}
              {% set total = ns.h|length + ns.t|length + ns.d|length %}
              {% if total == 0 %}✅ **Alles unauffällig** – Rochlitz läuft normal.{% else %}
              {% if ns.h %}**🏡 Haus**
              {% for x in ns.h %}- {{ x }}
              {% endfor %}
              {% endif %}
              {% if ns.t %}**🖥️ Technik**
              {% for x in ns.t %}- {{ x }}
              {% endfor %}
              {% endif %}
              {% if ns.d %}**📡 Datenqualität**
              {% for x in ns.d %}- {{ x }}
              {% endfor %}
              {% endif %}
              {% endif %}
      - type: grid
        cards:
          - type: heading
            heading: Raumklima
            heading_style: title
            icon: mdi:home-thermometer-outline
            badges:
              - type: entity
                entity: sensor.temperature_humidity_sensor_7cd9_temperature
                show_state: true
                show_icon: true
                icon: mdi:tree-outline
                color: orange
              - type: entity
                entity: sensor.temperature_humidity_sensor_7cd9_humidity
                show_state: true
                show_icon: true
                icon: mdi:water-percent
                color: blue
            tap_action:
              action: navigate
              navigation_path: /dashboard-rochlitz/klima
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Wohnzimmer
                secondary: "{{ ((states('sensor.rochlitz_wohnzimmer_temperatur')|float|round(1)|string) ~ ' °C' if is_number(states('sensor.rochlitz_wohnzimmer_temperatur')) else '–') }} · {{ ((states('sensor.rochlitz_wohnzimmer_luftfeuchtigkeit')|float|round(0)|int|string) ~ ' %' if is_number(states('sensor.rochlitz_wohnzimmer_luftfeuchtigkeit')) else '–') }}"
                icon: mdi:sofa-outline
                icon_color: "{% set t = states('sensor.rochlitz_wohnzimmer_temperatur')|float(none) %}{% if t is none %}disabled{% elif t < 17 %}blue{% elif t < 20 %}cyan{% elif t < 24 %}green{% elif t < 27 %}orange{% else %}red{% endif %}"
                layout: vertical
                entity: sensor.rochlitz_wohnzimmer_temperatur
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-rochlitz/klima
              - type: custom:mushroom-template-card
                primary: Oma
                secondary: "{{ ((states('sensor.rochlitz_oma_temperatur')|float|round(1)|string) ~ ' °C' if is_number(states('sensor.rochlitz_oma_temperatur')) else '–') }} · {{ ((states('sensor.rochlitz_oma_luftfeuchtigkeit')|float|round(0)|int|string) ~ ' %' if is_number(states('sensor.rochlitz_oma_luftfeuchtigkeit')) else '–') }}"
                icon: mdi:human-cane
                icon_color: "{% set t = states('sensor.rochlitz_oma_temperatur')|float(none) %}{% if t is none %}disabled{% elif t < 17 %}blue{% elif t < 20 %}cyan{% elif t < 24 %}green{% elif t < 27 %}orange{% else %}red{% endif %}"
                layout: vertical
                entity: sensor.rochlitz_oma_temperatur
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-rochlitz/klima
              - type: custom:mushroom-template-card
                primary: Tilo
                secondary: "{{ ((states('sensor.indoor_temperature')|float|round(1)|string) ~ ' °C' if is_number(states('sensor.indoor_temperature')) else '–') }} · {{ ((states('sensor.indoor_humidity')|float|round(0)|int|string) ~ ' %' if is_number(states('sensor.indoor_humidity')) else '–') }}"
                icon: mdi:bed-outline
                icon_color: "{% set t = states('sensor.indoor_temperature')|float(none) %}{% if t is none %}disabled{% elif t < 17 %}blue{% elif t < 20 %}cyan{% elif t < 24 %}green{% elif t < 27 %}orange{% else %}red{% endif %}"
                layout: vertical
                entity: sensor.indoor_temperature
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-rochlitz/klima
              - type: custom:mushroom-template-card
                primary: Büro
                secondary: "{{ ((states('sensor.esp32c3_rl_buro_temperature_2')|float|round(1)|string) ~ ' °C' if is_number(states('sensor.esp32c3_rl_buro_temperature_2')) else '–') }} · {{ ((states('sensor.esp32c3_rl_buro_humidity_2')|float|round(0)|int|string) ~ ' %' if is_number(states('sensor.esp32c3_rl_buro_humidity_2')) else '–') }}"
                icon: mdi:desk
                icon_color: "{% set t = states('sensor.esp32c3_rl_buro_temperature_2')|float(none) %}{% if t is none %}disabled{% elif t < 17 %}blue{% elif t < 20 %}cyan{% elif t < 24 %}green{% elif t < 27 %}orange{% else %}red{% endif %}"
                layout: vertical
                entity: sensor.esp32c3_rl_buro_temperature_2
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-rochlitz/klima
              - type: custom:mushroom-template-card
                primary: Serverraum
                secondary: "{{ ((states('sensor.rochlitz_serverraum_serverraum_temperatur')|float|round(1)|string) ~ ' °C' if is_number(states('sensor.rochlitz_serverraum_serverraum_temperatur')) else '–') }} · {{ ((states('sensor.rochlitz_serverraum_serverraum_luftfeuchtigkeit')|float|round(0)|int|string) ~ ' %' if is_number(states('sensor.rochlitz_serverraum_serverraum_luftfeuchtigkeit')) else '–') }}"
                icon: mdi:server
                icon_color: "{% set t = states('sensor.rochlitz_serverraum_serverraum_temperatur')|float(none) %}{% if t is none %}disabled{% elif t < 15 %}blue{% elif t < 18 %}cyan{% elif t < 26 %}green{% elif t < 30 %}orange{% else %}red{% endif %}"
                layout: vertical
                entity: sensor.rochlitz_serverraum_serverraum_temperatur
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-rochlitz/klima
          - type: custom:mushroom-template-card
            primary: Außen
            secondary: "{{ ((states('sensor.temperature_humidity_sensor_7cd9_temperature')|float|round(1)|string) ~ ' °C' if is_number(states('sensor.temperature_humidity_sensor_7cd9_temperature')) else '–') }} · {{ ((states('sensor.temperature_humidity_sensor_7cd9_humidity')|float|round(0)|int|string) ~ ' %' if is_number(states('sensor.temperature_humidity_sensor_7cd9_humidity')) else '–') }} · Dach {{ ((states('sensor.uvr16x2_node_2_analog_logging_5')|float|round(1)|string) ~ ' °C' if is_number(states('sensor.uvr16x2_node_2_analog_logging_5')) else '–') }}"
            icon: mdi:tree-outline
            icon_color: "{% set t = states('sensor.temperature_humidity_sensor_7cd9_temperature')|float(none) %}{% if t is none %}disabled{% elif t < 0 %}indigo{% elif t < 10 %}blue{% elif t < 20 %}green{% elif t < 28 %}orange{% else %}red{% endif %}"
            layout: horizontal
            entity: sensor.temperature_humidity_sensor_7cd9_temperature
            tap_action:
              action: navigate
              navigation_path: /dashboard-rochlitz/klima
      - type: grid
        cards:
          - type: heading
            heading: Heizung & Warmwasser
            heading_style: title
            icon: mdi:fire
            badges:
              - type: entity
                entity: sensor.uvr16x2_node_2_input_7
                show_state: true
                show_icon: true
                icon: mdi:solar-power
                color: orange
              - type: entity
                entity: sensor.uvr16x2_node_2_analog_logging_2
                show_state: true
                show_icon: true
                icon: mdi:water-boiler
                color: red
            tap_action:
              action: navigate
              navigation_path: /dashboard-rochlitz/heizung
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Warmwasser
                secondary: "{{ ((states('sensor.uvr16x2_node_2_analog_logging_2')|float|round(1)|string) ~ ' °C' if is_number(states('sensor.uvr16x2_node_2_analog_logging_2')) else '–') }}"
                icon: mdi:water-boiler
                icon_color: "{% set t = states('sensor.uvr16x2_node_2_analog_logging_2')|float(none) %}{% if t is none %}disabled{% elif t < 35 %}blue{% elif t < 45 %}orange{% elif t < 60 %}red{% else %}purple{% endif %}"
                layout: vertical
                entity: sensor.uvr16x2_node_2_analog_logging_2
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-rochlitz/heizung
              - type: custom:mushroom-template-card
                primary: Kollektor
                secondary: "{{ ((states('sensor.uvr16x2_node_2_input_7')|float|round(1)|string) ~ ' °C' if is_number(states('sensor.uvr16x2_node_2_input_7')) else '–') }}"
                icon: mdi:solar-power
                icon_color: "{% set t = states('sensor.uvr16x2_node_2_input_7')|float(none) %}{% if t is none %}disabled{% elif t < 30 %}blue{% elif t < 60 %}amber{% elif t < 90 %}orange{% else %}red{% endif %}"
                layout: vertical
                entity: sensor.uvr16x2_node_2_input_7
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-rochlitz/heizung
          - type: custom:mushroom-template-card
            primary: Solar-Ladung
            secondary: |-
              {% set k = states('sensor.uvr16x2_node_2_input_7')|float(none) %}{% set s = states('sensor.uvr16x2_node_2_input_4')|float(none) %}
              {% if none in [k, s] %}Keine Messwerte{% else %}
              Δ Kollektor – Speicher unten: {{ (k - s)|round(1) }} K
              {% if k - s > 8 %} · Solar lädt vermutlich{% elif k - s > 3 %} · Anlauf möglich{% else %} · keine Ladung{% endif %}
              {% endif %}
            icon: mdi:solar-power
            icon_color: |-
              {% set k = states('sensor.uvr16x2_node_2_input_7')|float(none) %}{% set s = states('sensor.uvr16x2_node_2_input_4')|float(none) %}
              {% if none in [k, s] %}disabled{% elif k - s > 8 %}orange{% elif k - s > 3 %}amber{% else %}grey{% endif %}
            layout: horizontal
            entity: sensor.uvr16x2_node_2_input_7
            tap_action:
              action: navigate
              navigation_path: /dashboard-rochlitz/heizung
            multiline_secondary: true
          - type: custom:mushroom-template-card
            primary: Kessel
            secondary: |-
              {% set v = states('sensor.uvr16x2_node_2_input_1')|float(none) %}{% set o = states('sensor.uvr16x2_node_2_input_2')|float(none) %}
              {% if none in [v, o] %}Keine Messwerte{% else %}
              Vorlauf {{ v|round(1) }} °C · Speicher oben {{ o|round(1) }} °C
              {% if v - o > 10 %} · Kessel lädt vermutlich{% elif v - o < -5 %} · Speicher gibt Wärme ab{% else %} · Gleichgewicht{% endif %}
              {% endif %}
            icon: mdi:fire
            icon_color: |-
              {% set v = states('sensor.uvr16x2_node_2_input_1')|float(none) %}{% set o = states('sensor.uvr16x2_node_2_input_2')|float(none) %}
              {% if none in [v, o] %}disabled{% elif v - o > 10 %}red{% else %}grey{% endif %}
            layout: horizontal
            entity: sensor.uvr16x2_node_2_input_1
            tap_action:
              action: navigate
              navigation_path: /dashboard-rochlitz/heizung
            multiline_secondary: true
          - type: custom:mini-graph-card
            name: Warmwasser 48 h
            icon: mdi:water-boiler
            entities:
              - sensor.uvr16x2_node_2_analog_logging_2
            hours_to_show: 48
            points_per_hour: 0.75
            line_width: 2
            smoothing: true
            color_thresholds:
              - value: 30
                color: '#1414b8'
              - value: 35
                color: '#f39c12'
              - value: 40
                color: '#d35400'
              - value: 45
                color: '#c0392b'
              - value: 55
                color: '#901090'
            show:
              fill: fade
              extrema: true
              labels: false
            height: 60
      - type: grid
        cards:
          - type: heading
            heading: Strom
            heading_style: title
            icon: mdi:flash-outline
            tap_action:
              action: navigate
              navigation_path: /dashboard-rochlitz/strom
          - type: custom:mushroom-template-card
            primary: Steckdosen gesamt
            secondary: "{{ ([states('sensor.rochlitz_kuhlschrank_power'),states('sensor.smart_switch_24060408263254510802c4e7ae048e5e_power'),states('sensor.smart_switch_24022135042720510d0148e1e9ed26af_power'),states('sensor.smart_switch_24022139185434510d0148e1e9ed14d7_power'),states('sensor.kaffeemaschine_rochlitz_power'),states('sensor.smart_switch_24022106833283510d0148e1e9ed3010_power'),states('sensor.smart_switch_23070778577851510d0248e1e9cfc20b_power'),states('sensor.smart_switch_23070739203051510d0248e1e9cfc328_power')]|map('float', 0)|sum)|round(0)|int }} W gemessen (ohne Heizung/Licht)"
            icon: mdi:flash-circle
            icon_color: amber
            layout: horizontal
            tap_action:
              action: navigate
              navigation_path: /dashboard-rochlitz/strom
            multiline_secondary: true
          - type: custom:apexcharts-card
            chart_type: donut
            header:
              show: true
              title: Leistung jetzt
              show_states: false
            apex_config:
              legend:
                position: bottom
            series:
              - entity: sensor.rochlitz_kuhlschrank_power
                name: Kühlschrank
                show:
                  legend_value: true
              - entity: sensor.smart_switch_24060408263254510802c4e7ae048e5e_power
                name: Oma
                show:
                  legend_value: true
              - entity: sensor.smart_switch_24022135042720510d0148e1e9ed26af_power
                name: Waschmaschine
                show:
                  legend_value: true
              - entity: sensor.smart_switch_24022139185434510d0148e1e9ed14d7_power
                name: Computer
                show:
                  legend_value: true
              - entity: sensor.kaffeemaschine_rochlitz_power
                name: Kaffeemaschine
                show:
                  legend_value: true
              - entity: sensor.smart_switch_24022106833283510d0148e1e9ed3010_power
                name: Wohnzimmer
                show:
                  legend_value: true
              - entity: sensor.smart_switch_23070778577851510d0248e1e9cfc20b_power
                name: Tilo
                show:
                  legend_value: true
              - entity: sensor.smart_switch_23070739203051510d0248e1e9cfc328_power
                name: Büro / Musik
                show:
                  legend_value: true
      - type: grid
        cards:
          - type: heading
            heading: Haus & Sicherheit
            heading_style: title
            icon: mdi:cctv
            tap_action:
              action: navigate
              navigation_path: /dashboard-rochlitz/haus
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Kaffee
                secondary: "{{ states('select.kaffeevollautomat_aktives_programm') }} · {{ 'online' if is_state('binary_sensor.kaffeevollautomat_konnektivitat','on') else 'offline' }}"
                icon: mdi:coffee-maker
                icon_color: "{{ 'brown' if is_state('switch.kaffeevollautomat_einschalter','on') else 'disabled' }}"
                layout: vertical
                entity: switch.kaffeevollautomat_einschalter
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-rochlitz/haus
                multiline_secondary: true
              - type: custom:mushroom-template-card
                primary: Backofen
                secondary: "{{ states('sensor.aeg_backofen_upperoven_appliancestate') }} · {{ ((states('sensor.aeg_backofen_upperoven_displaytemperaturec')|float|round(0)|int|string) ~ ' °C' if is_number(states('sensor.aeg_backofen_upperoven_displaytemperaturec')) else '–') }}"
                icon: mdi:stove
                icon_color: "{{ 'red' if states('sensor.aeg_backofen_upperoven_appliancestate')|lower == 'running' else 'disabled' }}"
                layout: vertical
                entity: sensor.aeg_backofen_upperoven_appliancestate
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-rochlitz/haus
                multiline_secondary: true
              - type: custom:mushroom-template-card
                primary: Mähroboter
                secondary: "{{ states('lawn_mower.bennivision_cloud') }}"
                icon: mdi:robot-mower-outline
                icon_color: "{{ 'green' if is_state('lawn_mower.bennivision_cloud','mowing') else 'disabled' }}"
                layout: vertical
                entity: lawn_mower.bennivision_cloud
                tap_action: &id001
                  action: more-info
