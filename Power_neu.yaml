            show:
              legend_value: true
          - entity: sensor.wohnzimmer_power_consumption
            name: Wohnzimmer / TV
            show:
              legend_value: true
          - entity: sensor.smart_switch_24060472346212510802c4e7ae048cf8_power
            name: Schwippbogen
            show:
              legend_value: true
          - entity: sensor.smart_switch_24060416836319510802c4e7ae048cef_power
            name: Schneemänner
            show:
              legend_value: true
          - entity: sensor.schlafzimmer_energy_power
            name: Schlafzimmer
            show:
              legend_value: true
          - entity: sensor.ikea_of_sweden_starkvind_air_purifier_table_power
