# =============================================================================
#  Strom Melsungen – Neuentwurf der Ansicht "Energy"
# =============================================================================
#  Einrichtung (Ansicht ersetzen):
#    Dashboard bearbeiten → Tab "Energy" → Stift-Symbol (Ansicht bearbeiten)
#    → ⋮ → "In YAML bearbeiten" → gesamten Inhalt dieser Datei einfügen → Speichern.
#  Benötigte Frontend-Karten (HACS): mushroom, mini-graph-card, apexcharts-card.
#  Strompreis für die Kostenrechnung: in den Templates "Standby-Check" und
#  "Dauerläufer" die Variable  price  ändern (aktuell 0.35 €/kWh).
# =============================================================================
title: Strom
path: energy
icon: mdi:home-lightning-bolt-outline
type: sections
max_columns: 4
sections:
  - type: grid
    cards:
      - type: heading
        heading: Jetzt
        heading_style: title
        icon: mdi:flash
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: Steckdosen gesamt
            secondary: "{{ ([states('sensor.waschmaschine_power'),states('sensor.trockner_power'),states('sensor.kuhlschrank_power'),states('sensor.thermomix_power'),states('sensor.kaffeemaschine_power'),states('sensor.wohnzimmer_power_consumption'),states('sensor.smart_switch_24060472346212510802c4e7ae048cf8_power'),states('sensor.smart_switch_24060416836319510802c4e7ae048cef_power'),states('sensor.schlafzimmer_energy_power'),states('sensor.ikea_of_sweden_starkvind_air_purifier_table_power'),states('sensor.arbeitsplatz_power_2'),states('sensor.technik_power'),states('sensor.shelly_plug_s_shelly_plug_s_power'),states('sensor.staubsauger_power')]|map('float', 0)|sum)|round(0)|int }} W"
            icon: mdi:flash-circle
            icon_color: "{% set p = [states('sensor.waschmaschine_power'),states('sensor.trockner_power'),states('sensor.kuhlschrank_power'),states('sensor.thermomix_power'),states('sensor.kaffeemaschine_power'),states('sensor.wohnzimmer_power_consumption'),states('sensor.smart_switch_24060472346212510802c4e7ae048cf8_power'),states('sensor.smart_switch_24060416836319510802c4e7ae048cef_power'),states('sensor.schlafzimmer_energy_power'),states('sensor.ikea_of_sweden_starkvind_air_purifier_table_power'),states('sensor.arbeitsplatz_power_2'),states('sensor.technik_power'),states('sensor.shelly_plug_s_shelly_plug_s_power'),states('sensor.staubsauger_power')]|map('float', 0)|sum %}{% if p < 300 %}green{% elif p < 800 %}amber{% else %}orange{% endif %}"
            layout: vertical
            tap_action:
              action: none
          - type: custom:mushroom-template-card
            primary: Größter Verbraucher
            secondary: "{% set ns = namespace(n='', p=0) %}{% for n, e in [('Waschmaschine','sensor.waschmaschine_power'),('Trockner','sensor.trockner_power'),('Kühlschrank','sensor.kuhlschrank_power'),('Thermomix','sensor.thermomix_power'),('Kaffeemaschine','sensor.kaffeemaschine_power'),('Wohnzimmer / TV','sensor.wohnzimmer_power_consumption'),('Schwippbogen','sensor.smart_switch_24060472346212510802c4e7ae048cf8_power'),('Schneemänner','sensor.smart_switch_24060416836319510802c4e7ae048cef_power'),('Schlafzimmer','sensor.schlafzimmer_energy_power'),('Luftreiniger (Starkvind)','sensor.ikea_of_sweden_starkvind_air_purifier_table_power'),('Arbeitsplatz','sensor.arbeitsplatz_power_2'),('Technik-Schrank','sensor.technik_power'),('Keller (Shelly)','sensor.shelly_plug_s_shelly_plug_s_power'),('Server (Plug „Staubsauger“)','sensor.staubsauger_power')] %}{% set p = states(e)|float(0) %}{% if p > ns.p %}{% set ns.p = p %}{% set ns.n = n %}{% endif %}{% endfor %}{{ (ns.n ~ ' · ' ~ (ns.p|round(0)|int) ~ ' W') if ns.p >= 1 else 'nichts nennenswert' }}"
            icon: mdi:podium-gold
            icon_color: amber
            layout: vertical
            tap_action:
              action: none
            multiline_secondary: true
          - type: custom:mushroom-template-card
            primary: Aktive Geräte
            secondary: "{% set ns = namespace(c=0) %}{% for e in ['sensor.waschmaschine_power','sensor.trockner_power','sensor.kuhlschrank_power','sensor.thermomix_power','sensor.kaffeemaschine_power','sensor.wohnzimmer_power_consumption','sensor.smart_switch_24060472346212510802c4e7ae048cf8_power','sensor.smart_switch_24060416836319510802c4e7ae048cef_power','sensor.schlafzimmer_energy_power','sensor.ikea_of_sweden_starkvind_air_purifier_table_power','sensor.arbeitsplatz_power_2','sensor.technik_power','sensor.shelly_plug_s_shelly_plug_s_power','sensor.staubsauger_power'] %}{% if states(e)|float(0) > 5 %}{% set ns.c = ns.c + 1 %}{% endif %}{% endfor %}{{ ns.c }} von 14 Geräten aktiv"
            icon: mdi:power-plug
            icon_color: blue
            layout: vertical
            tap_action:
              action: none
            multiline_secondary: true
          - type: custom:mushroom-template-card
            primary: Dauerläufer
            secondary: "{{ ([states('sensor.kuhlschrank_power'),states('sensor.technik_power'),states('sensor.shelly_plug_s_shelly_plug_s_power'),states('sensor.staubsauger_power')]|map('float', 0)|sum)|round(0)|int }} W"
            icon: mdi:autorenew
            icon_color: purple
            layout: vertical
            tap_action:
              action: none
      - type: markdown
        content: ℹ️ *Summe der gemessenen Steckdosen – nicht der Hausverbrauch (Heizung, Beleuchtung, Herd, nicht gemessene Geräte fehlen).*
      - type: custom:mushroom-template-card
        primary: Standby-Check
        secondary: |-
          {% set price = 0.35 %}
          {% set ns = namespace(l=[], w=0) %}
          {% for n, e in [('Waschmaschine','sensor.waschmaschine_power'),('Trockner','sensor.trockner_power'),('Thermomix','sensor.thermomix_power'),('Kaffeemaschine','sensor.kaffeemaschine_power'),('Wohnzimmer / TV','sensor.wohnzimmer_power_consumption'),('Schwippbogen','sensor.smart_switch_24060472346212510802c4e7ae048cf8_power'),('Schneemänner','sensor.smart_switch_24060416836319510802c4e7ae048cef_power'),('Schlafzimmer','sensor.schlafzimmer_energy_power'),('Luftreiniger (Starkvind)','sensor.ikea_of_sweden_starkvind_air_purifier_table_power'),('Arbeitsplatz','sensor.arbeitsplatz_power_2')] %}
          {% set p = states(e)|float(0) %}{% if p >= 0.5 and p < 20 %}{% set ns.l = ns.l + [n ~ ' ' ~ (p|round(1)) ~ ' W'] %}{% set ns.w = ns.w + p %}{% endif %}
          {% endfor %}
          {% if ns.l %}Mögliche Standby-Verbraucher (0,5–20 W): {{ ns.l|join(', ') }} – zusammen {{ ns.w|round(1) }} W ≈ {{ (ns.w * 8.76 * price)|round(0)|int }} € pro Jahr bei {{ price }} €/kWh.{% else %}Keine auffälligen Standby-Verbraucher.{% endif %}
        icon: mdi:sleep
        icon_color: "{% set ns = namespace(w=0) %}{% for e in ['sensor.waschmaschine_power','sensor.trockner_power','sensor.thermomix_power','sensor.kaffeemaschine_power','sensor.wohnzimmer_power_consumption','sensor.smart_switch_24060472346212510802c4e7ae048cf8_power','sensor.smart_switch_24060416836319510802c4e7ae048cef_power','sensor.schlafzimmer_energy_power','sensor.ikea_of_sweden_starkvind_air_purifier_table_power','sensor.arbeitsplatz_power_2'] %}{% set p = states(e)|float(0) %}{% if p >= 0.5 and p < 20 %}{% set ns.w = ns.w + p %}{% endif %}{% endfor %}{{ 'green' if ns.w < 10 else ('amber' if ns.w < 30 else 'orange') }}"
        layout: horizontal
        tap_action:
          action: none
        multiline_secondary: true
  - type: grid
    cards:
      - type: heading
        heading: Ranking – wer zieht gerade Strom?
        heading_style: title
        icon: mdi:format-list-numbered
      - type: markdown
        content: |-
          {% set ns = namespace(l=[], tot=0) %}
          {% for n, e in [('Waschmaschine','sensor.waschmaschine_power'),('Trockner','sensor.trockner_power'),('Kühlschrank','sensor.kuhlschrank_power'),('Thermomix','sensor.thermomix_power'),('Kaffeemaschine','sensor.kaffeemaschine_power'),('Wohnzimmer / TV','sensor.wohnzimmer_power_consumption'),('Schwippbogen','sensor.smart_switch_24060472346212510802c4e7ae048cf8_power'),('Schneemänner','sensor.smart_switch_24060416836319510802c4e7ae048cef_power'),('Schlafzimmer','sensor.schlafzimmer_energy_power'),('Luftreiniger (Starkvind)','sensor.ikea_of_sweden_starkvind_air_purifier_table_power'),('Arbeitsplatz','sensor.arbeitsplatz_power_2'),('Technik-Schrank','sensor.technik_power'),('Keller (Shelly)','sensor.shelly_plug_s_shelly_plug_s_power'),('Server (Plug „Staubsauger“)','sensor.staubsauger_power')] %}
          {% set p = states(e)|float(0) %}{% set ns.l = ns.l + [{'n': n, 'p': p}] %}{% set ns.tot = ns.tot + p %}
          {% endfor %}
          {% set mx = ns.l|map(attribute='p')|max %}
          {% if mx < 1 %}Alle gemessenen Geräte unter 1 W.{% else %}
          **Summe: {{ ns.tot|round(0)|int }} W**

          | Gerät | Leistung | |
          |---|--:|---|
          {%- for x in ns.l|sort(attribute='p', reverse=true) %}
          {%- if x.p >= 1 %}
          | {{ x.n }} | {{ x.p|round(0)|int }} W | {{ '█' * ([(x.p / mx * 12)|round(0)|int, 1]|max) }} |
          {%- endif %}
          {%- endfor %}
          {% endif %}
