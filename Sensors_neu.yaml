    column_span: 2
  - type: grid
    cards:
      - type: heading
        heading: Komfort-Check
        heading_style: title
        icon: mdi:clipboard-check-outline
      - type: markdown
        content: |-
          {% set rooms = [('Wohnzimmer','sensor.wohnzimmer_temperature',none,none,18,24,0,100),('Arbeitszimmer','sensor.abstellkammer_temperature','sensor.abstellkammer_humidity','sensor.office_co2_office_eco2',18,24,35,60),('Küche','sensor.wetterstation_temperature','sensor.wetterstation_humidity','sensor.wetterstation_co2',18,25,35,60),('Bad','sensor.bad_temperature','sensor.bad_humidity',none,20,26,35,70),('Schlafzimmer','sensor.schlafzimmer_schlafzimmer_temperatur','sensor.schlafzimmer_schlafzimmer_luftfeuchtigkeit','sensor.schlafzimmer_schlafzimmer_co2_equivalent',16,21,35,60),('Frida','sensor.frida_temperatur','sensor.frida_luftfeuchtigkeit','sensor.frida_frida_co2_equivalent_2',18,22,35,60),('Matilda','sensor.kids_matilda_kids_matilda_temperature','sensor.kids_matilda_kids_matilda_humidity',none,18,22,35,60),('Keller','sensor.keller_bme280_temperature','sensor.keller_bme280_humidity',none,8,20,30,65)] %}
          | Raum | Temp. | rF | CO₂ | Bewertung |
          |---|--:|--:|--:|---|
          {%- for n, t, h, c, lo, hi, hlo, hhi in rooms %}
          {%- set tv = states(t)|float(none) if t else none %}{%- set hv = states(h)|float(none) if h else none %}{%- set cv = states(c)|float(none) if c else none %}
          | {{ n }} | {{ (tv|round(1)|string ~ ' °C') if tv is not none else '–' }} | {{ (hv|round(0)|int|string ~ ' %') if hv is not none else '–' }} | {{ (cv|round(0)|int|string ~ ' ppm') if cv is not none else '–' }} | {{ '⚪ keine Daten' if tv is none else ('💨 lüften' if (cv is not none and cv > 1400) else ('🔵 zu kühl' if tv < lo else ('🟠 zu warm' if tv > hi else ('💧 zu feucht' if (hv is not none and hv > hhi) else ('🏜️ zu trocken' if (hv is not none and hv < hlo) else ('🟡 CO₂ erhöht' if (cv is not none and cv > 1000) else '🟢 gut')))))) }} |
          {%- endfor %}
      - type: markdown
        content: '*Richtwerte: Temperatur Wohnräume 18–24 °C (Schlafzimmer 16–21 °C, Keller 8–20 °C), relative Feuchte 35–60 % (Bad bis 70 %), CO₂ ab 1 000 ppm erhöht, ab 1 400 ppm lüften.*'
  - type: grid
    cards:
      - type: heading
        heading: Lüftungs-Assistent
        heading_style: title
        icon: mdi:window-open-variant
      - type: markdown
        content: |-
          {% set ta = states('sensor.balkon_melsungen_temperature')|float(none) %}{% set ha = states('sensor.balkon_melsungen_humidity')|float(none) %}
          {% if none in [ta, ha] %}Kein Außenwert vom Balkon-Sensor.{% else %}
          {% set tda = ta - (100 - ha) / 5 %}
          Außen: {{ ta|round(1) }} °C · {{ ha|round(0)|int }} % · Taupunkt ≈ {{ tda|round(1) }} °C

          | Raum | Taupunkt innen | Empfehlung |
          |---|--:|---|
          {%- for n, t, h, c in [('Schlafzimmer','sensor.schlafzimmer_schlafzimmer_temperatur','sensor.schlafzimmer_schlafzimmer_luftfeuchtigkeit','sensor.schlafzimmer_schlafzimmer_co2_equivalent'),('Frida','sensor.frida_temperatur','sensor.frida_luftfeuchtigkeit','sensor.frida_frida_co2_equivalent_2'),('Matilda','sensor.kids_matilda_kids_matilda_temperature','sensor.kids_matilda_kids_matilda_humidity',none),('Arbeitszimmer','sensor.abstellkammer_temperature','sensor.abstellkammer_humidity','sensor.office_co2_office_eco2'),('Bad','sensor.bad_temperature','sensor.bad_humidity',none),('Keller','sensor.keller_bme280_temperature','sensor.keller_bme280_humidity',none)] %}
          {%- set tv = states(t)|float(none) %}{%- set hv = states(h)|float(none) %}{%- set cv = states(c)|float(none) if c else none %}
          {%- if none in [tv, hv] %}
          | {{ n }} | – | ⚪ keine Daten |
          {%- else %}
          {%- set tdr = tv - (100 - hv) / 5 %}
          | {{ n }} | {{ tdr|round(1) }} °C | {{ ('🟢 Lüften entfeuchtet' if (tda < tdr - 1 and (n != 'Keller' or tda < tv - 2)) else ('🔴 geschlossen halten (Außenluft feuchter)' if tda > tdr + 1 else ('🔴 nicht lüften (Kondensat an kühlen Wänden)' if (n == 'Keller' and tda >= tv - 2) else '⚪ neutral'))) }}{{ ' · 💨 CO₂ hoch' if (cv is not none and cv > 1000) else '' }} |
          {%- endif %}
          {%- endfor %}
          {% endif %}
      - type: markdown
        content: '*Taupunkt-Näherung `T − (100 − rF)/5`. Lüften entfeuchtet, wenn die Außenluft einen niedrigeren Taupunkt hat als der Raum; im Keller zusätzlich nur, wenn der Außentaupunkt ≥ 2 K unter der Kellertemperatur liegt (sonst Kondensation).*'
