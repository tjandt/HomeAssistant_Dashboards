# =============================================================================
#  Raumklima & Luftqualität Melsungen – Neuentwurf der Ansicht "Sensors"
# =============================================================================
#  Einrichtung (Ansicht ersetzen):
#    Dashboard bearbeiten → Tab "Sensors" → Stift-Symbol (Ansicht bearbeiten)
#    → ⋮ → "In YAML bearbeiten" → gesamten Inhalt dieser Datei einfügen → Speichern.
#  Benötigte Frontend-Karten (HACS): mushroom, mini-graph-card (beide schon vorhanden).
#  Keine Navigation / keine URL-Anpassung nötig; Details stehen im unteren Bereich.
# =============================================================================
title: Raumklima
path: sensors
icon: mdi:home-thermometer-outline
type: sections
max_columns: 4
sections:
  - type: grid
    cards:
      - type: heading
        heading: Auf einen Blick
        heading_style: title
        icon: mdi:home-thermometer-outline
        badges:
          - type: entity
            entity: sensor.balkon_melsungen_temperature
            show_state: true
            show_icon: true
            icon: mdi:tree-outline
            color: orange
          - type: entity
            entity: sensor.balkon_melsungen_humidity
            show_state: true
            show_icon: true
            icon: mdi:water-percent
            color: blue
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: Innen Ø
            secondary: "{% set l = [states('sensor.wohnzimmer_temperature'),states('sensor.abstellkammer_temperature'),states('sensor.wetterstation_temperature'),states('sensor.bad_temperature'),states('sensor.schlafzimmer_schlafzimmer_temperatur'),states('sensor.frida_temperatur'),states('sensor.kids_matilda_kids_matilda_temperature')]|map('float', none)|reject('none')|list %}{{ ((l|sum/l|length)|round(1)|string ~ ' °C') if l else '–' }}"
            icon: mdi:home-thermometer-outline
            icon_color: "{% set l = [states('sensor.wohnzimmer_temperature'),states('sensor.abstellkammer_temperature'),states('sensor.wetterstation_temperature'),states('sensor.bad_temperature'),states('sensor.schlafzimmer_schlafzimmer_temperatur'),states('sensor.frida_temperatur'),states('sensor.kids_matilda_kids_matilda_temperature')]|map('float', none)|reject('none')|list %}{% set t = (l|sum/l|length) if l else none %}{% if t is none %}disabled{% elif t < 17 %}blue{% elif t < 20 %}cyan{% elif t < 24 %}green{% elif t < 27 %}orange{% else %}red{% endif %}"
            layout: vertical
            tap_action:
              action: none
          - type: custom:mushroom-template-card
            primary: Luftfeuchte Ø
            secondary: "{% set l = [states('sensor.abstellkammer_humidity'),states('sensor.wetterstation_humidity'),states('sensor.bad_humidity'),states('sensor.schlafzimmer_schlafzimmer_luftfeuchtigkeit'),states('sensor.frida_luftfeuchtigkeit'),states('sensor.kids_matilda_kids_matilda_humidity')]|map('float', none)|reject('none')|list %}{{ ((l|sum/l|length)|round(0)|int|string ~ ' %') if l else '–' }}"
            icon: mdi:water-percent
            icon_color: "{% set l = [states('sensor.abstellkammer_humidity'),states('sensor.wetterstation_humidity'),states('sensor.bad_humidity'),states('sensor.schlafzimmer_schlafzimmer_luftfeuchtigkeit'),states('sensor.frida_luftfeuchtigkeit'),states('sensor.kids_matilda_kids_matilda_humidity')]|map('float', none)|reject('none')|list %}{% set t = (l|sum/l|length) if l else none %}{% if t is none %}disabled{% elif t < 30 %}orange{% elif t < 40 %}amber{% elif t < 60 %}green{% elif t < 70 %}orange{% else %}red{% endif %}"
            layout: vertical
            tap_action:
              action: none
          - type: custom:mushroom-template-card
            primary: CO₂ max
            secondary: "{% set l = [states('sensor.office_co2_office_eco2'),states('sensor.wetterstation_co2'),states('sensor.schlafzimmer_schlafzimmer_co2_equivalent'),states('sensor.frida_frida_co2_equivalent_2')]|map('float', none)|reject('none')|list %}{{ ((l|max)|round(0)|int|string ~ ' ppm') if l else '–' }}"
            icon: mdi:molecule-co2
            icon_color: "{% set l = [states('sensor.office_co2_office_eco2'),states('sensor.wetterstation_co2'),states('sensor.schlafzimmer_schlafzimmer_co2_equivalent'),states('sensor.frida_frida_co2_equivalent_2')]|map('float', none)|reject('none')|list %}{% set t = l|max if l else none %}{% if t is none %}disabled{% elif t < 800 %}green{% elif t < 1200 %}amber{% elif t < 1600 %}orange{% else %}red{% endif %}"
            layout: vertical
            tap_action:
              action: none
          - type: custom:mushroom-template-card
            primary: Außen
            secondary: "{{ ((states('sensor.balkon_melsungen_temperature')|float|round(1)|string) ~ ' °C' if is_number(states('sensor.balkon_melsungen_temperature')) else '–') }} · {{ ((states('sensor.balkon_melsungen_humidity')|float|round(0)|int|string) ~ ' %' if is_number(states('sensor.balkon_melsungen_humidity')) else '–') }}"
            icon: mdi:tree-outline
            icon_color: "{% set t = states('sensor.balkon_melsungen_temperature')|float(none) %}{% if t is none %}disabled{% elif t < 0 %}indigo{% elif t < 10 %}blue{% elif t < 20 %}green{% elif t < 28 %}orange{% else %}red{% endif %}"
            layout: vertical
            entity: sensor.balkon_melsungen_temperature
            tap_action: &id001
              action: more-info
      - type: markdown
        title: Meldungen
        content: |-
          {% set ns = namespace(m=[], dead=[]) %}
          {% for n, e in [('Arbeitszimmer','sensor.office_co2_office_eco2'),('Küche','sensor.wetterstation_co2'),('Schlafzimmer','sensor.schlafzimmer_schlafzimmer_co2_equivalent'),('Frida','sensor.frida_frida_co2_equivalent_2')] %}{% if states(e)|float(0) > 1400 %}{% set ns.m = ns.m + ['💨 CO₂ ' ~ n ~ ': ' ~ (states(e)|float|round(0)|int) ~ ' ppm – bitte lüften'] %}{% endif %}{% endfor %}
          {% for n, e in [('Arbeitszimmer','sensor.abstellkammer_humidity'),('Küche','sensor.wetterstation_humidity'),('Schlafzimmer','sensor.schlafzimmer_schlafzimmer_luftfeuchtigkeit'),('Frida','sensor.frida_luftfeuchtigkeit'),('Matilda','sensor.kids_matilda_kids_matilda_humidity')] %}{% if states(e)|float(0) > 65 %}{% set ns.m = ns.m + ['💧 Luft zu feucht in ' ~ n ~ ': ' ~ (states(e)|float|round(0)|int) ~ ' %'] %}{% endif %}{% endfor %}
          {% for n, e in [('Wohnzimmer','sensor.wohnzimmer_temperature'),('Arbeitszimmer','sensor.abstellkammer_temperature'),('Küche','sensor.wetterstation_temperature'),('Schlafzimmer','sensor.schlafzimmer_schlafzimmer_temperatur'),('Frida','sensor.frida_temperatur'),('Matilda','sensor.kids_matilda_kids_matilda_temperature')] %}{% if is_number(states(e)) and states(e)|float < 16 %}{% set ns.m = ns.m + ['🥶 ' ~ n ~ ' kühl: ' ~ (states(e)|float|round(1)) ~ ' °C'] %}{% endif %}{% endfor %}
          {% for n, e in [('Wohnzimmer','sensor.wohnzimmer_temperature'),('Arbeitszimmer','sensor.abstellkammer_temperature'),('Küche','sensor.wetterstation_temperature'),('Bad','sensor.bad_temperature'),('Schlafzimmer','sensor.schlafzimmer_schlafzimmer_temperatur'),('Frida','sensor.frida_temperatur'),('Matilda','sensor.kids_matilda_kids_matilda_temperature'),('Keller','sensor.keller_bme280_temperature'),('Balkon','sensor.balkon_melsungen_temperature'),('Wetterstation Balkon','sensor.wetterstation_wetterstation_wetterstation_balkon_temperature')] %}{% if states(e) in ['unavailable','unknown'] %}{% set ns.dead = ns.dead + [n] %}{% endif %}{% endfor %}
          {% if ns.dead %}{% set ns.m = ns.m + ['📡 Keine Messwerte: ' ~ ns.dead|join(', ')] %}{% endif %}
          {% if ns.m %}{% for x in ns.m %}- {{ x }}
          {% endfor %}{% else %}✅ **Alles im grünen Bereich** – keine Meldungen zu Raumklima und Luftqualität.{% endif %}
